# Local development services only. Never used for staging or production.
#
#   docker compose -f deploy/local/compose.yaml --env-file .env up -d
#   docker compose -f deploy/local/compose.yaml --env-file .env --profile identity up -d
#
# One browser origin, http://localhost:8000, served by `edge` (Caddyfile):
# the application (run on the host at 127.0.0.1:8001), ZITADEL and its
# Login V2 UI all appear on it, so sign-in never shows an identity-provider
# hostname (decision D-IDL; SaaS-OS ADR-0025). ZITADEL publishes no port.
#
# Every published port is bound to 127.0.0.1, so nothing is reachable from
# other machines. Images are pinned by tag and digest (verified 2026-10-20,
# see docs/project/PROGRESS.md). Secrets come from the untracked `.env`.

name: crm-app-local

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CRM_APP_DB_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    # The default `noeviction` policy is kept: an eviction policy can drop
    # queued jobs (SaaS-OS CONSUMER-GUIDE section 15).
    ports:
      - "127.0.0.1:${CRM_APP_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Development-only mail catcher (decision P2-F 3), opt-in with
  # `--profile mail`. With INVITATION_DELIVERY=email, EMAIL_PROVIDER=mailpit
  # and MAILPIT_SMTP_HOST=127.0.0.1, invitation emails land here instead of
  # anyone's inbox; read them at http://127.0.0.1:58025. SaaS-OS refuses the
  # Mailpit provider outside development and test.
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - "127.0.0.1:${CRM_APP_MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${CRM_APP_MAILPIT_UI_PORT:-58025}:8025"

  edge:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    ports:
      - "127.0.0.1:${CRM_APP_PUBLIC_PORT:-8000}:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    # Reaches the application on the host. Docker Desktop provides this name;
    # the mapping makes it work on Linux engines too.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- Local identity provider (profile `identity`) ---------------------------
  # Modelled on SaaS-OS's local identity topology (docs/LOCAL-IDENTITY.md at
  # the pinned commit). ZITADEL keeps its own database, separate from the
  # product's. The OIDC project and application are created afterwards by
  # `saas-os-local-identity`, run from this project's environment (README.md).

  zitadel-db:
    profiles: ["identity"]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${ZITADEL_DB_USER:?set ZITADEL_DB_USER in .env}
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORD:?set ZITADEL_DB_PASSWORD in .env}
      POSTGRES_DB: ${ZITADEL_DB_NAME:?set ZITADEL_DB_NAME in .env}
    volumes:
      # A new volume for the same-origin issuer (D-IDL): ZITADEL's issuer is
      # fixed when its database is first initialised. The previous volume,
      # `zitadel-db-data`, is left in place, unused.
      - zitadel-same-origin-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ZITADEL's image has no shell and runs as a non-root user, so it cannot
  # prepare the directory it writes its bootstrap token to.
  zitadel-bootstrap-dir:
    profiles: ["identity"]
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ["sh", "-c", "mkdir -p /bootstrap && chmod 0777 /bootstrap"]
    volumes:
      - ./.bootstrap:/bootstrap

  zitadel:
    profiles: ["identity"]
    # v4.19.5: the SaaS-OS reference topology names v4.19.0, which is inside
    # the affected ranges of GitHub advisories GHSA-x4c7-fpcx-w9q6,
    # GHSA-jh92-5mrj-p2w2 (fixed in 4.19.2), GHSA-mchc-246r-6m76,
    # GHSA-84fg-x5h4-w8xv and GHSA-qj3q-235g-qr6w (fixed in 4.19.5).
    image: ghcr.io/zitadel/zitadel:v4.19.5@sha256:a586456a208e0db4c633db0ba43c427c24b37846138b8b13ff16ad8e003a18d3
    command: start-from-init --masterkey "${ZITADEL_LOCAL_MASTERKEY:?set ZITADEL_LOCAL_MASTERKEY in .env}" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${ZITADEL_DB_NAME}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${ZITADEL_DB_USER}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # The external domain and port are what browsers see, what appears as
      # the token `iss`, and what ZITADEL matches the Host header against:
      # the application's own origin, through `edge`. They must equal
      # OIDC_ISSUER_URL and PUBLIC_APP_ORIGIN. Changing them needs a fresh
      # ZITADEL database (README.md).
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${CRM_APP_PUBLIC_PORT:-8000}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: crm-app-local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_FIRSTINSTANCE_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false" # pragma: allowlist secret
      # A machine user and personal access token, written to the bootstrap
      # directory, used only by `saas-os-local-identity`.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      # Login V2 (service `zitadel-login`) on the application's origin. Its
      # machine user and token are created on first start and written to the
      # untracked bootstrap directory; this follows ZITADEL's own Compose
      # setup. Production uses a system-user key instead (SaaS-OS ADR-0025 §7).
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:${CRM_APP_PUBLIC_PORT:-8000}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:${CRM_APP_PUBLIC_PORT:-8000}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:${CRM_APP_PUBLIC_PORT:-8000}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:${CRM_APP_PUBLIC_PORT:-8000}/ui/v2/login/login?samlRequest=
    volumes:
      - ./.bootstrap:/bootstrap
    depends_on:
      zitadel-db:
        condition: service_healthy
      zitadel-bootstrap-dir:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  zitadel-login:
    profiles: ["identity"]
    # ZITADEL's published Login V2 by default; ZITADEL_LOGIN_IMAGE selects
    # crm-app's LeadStack-styled build of the same release instead (decision
    # S-2; the crm-app-login repository, README.md "Local identity").
    image: ${ZITADEL_LOGIN_IMAGE:-ghcr.io/zitadel/zitadel-login:v4.19.5@sha256:2f8e57672fcd4f9a285d99355fae9f85fd7495768c090c07c3bbc2d84fc06617}
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /bootstrap/login-client.pat
      # Signs Login V2's session cookie; at least 32 characters.
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_LOGIN_SESSION_COOKIE_SECRET:?set ZITADEL_LOGIN_SESSION_COOKIE_SECRET in .env}
      # ZITADEL picks its instance from Host: the public host, not `zitadel`.
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http
      # "true" makes Login V2 refuse to finish a sign-in until the email is
      # verified (decision S-1, Stage A4). Off by default, as before; the
      # codes need an email provider (configure-zitadel.py, ZITADEL_LOCAL_SMTP).
      EMAIL_VERIFICATION: ${ZITADEL_LOCAL_EMAIL_VERIFICATION:-false}
    volumes:
      - ./.bootstrap:/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 20

volumes:
  db-data:
  zitadel-same-origin-data:
