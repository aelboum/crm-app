# The worker's only way out (SaaS-OS ADR-0059; decision D-STG). SaaS-OS's
# egress client resolves and pins the address itself, then asks for a
# CONNECT tunnel to that IP literal on port 443. Everything else is refused:
# plain HTTP, other ports, host names, IPv6, and private, loopback,
# link-local, shared, documentation, benchmarking and multicast ranges.
http_port 3128
cache deny all

acl CONNECT method CONNECT
acl tls_port port 443
acl ipv4_literal dstdom_regex -n ^[0-9]{1,3}(\.[0-9]{1,3}){3}$
acl not_public dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4

http_access deny !CONNECT
http_access deny !tls_port
http_access deny !ipv4_literal
http_access deny not_public
http_access allow CONNECT
http_access deny all

# Who asked, which address and port, the status: no URLs, no bodies.
logformat egress %ts.%03tu %>a %rm %<a:%<p %>Hs %Ss
# In the container's tmpfs (Squid runs as `proxy` and cannot open stdout):
# `docker compose exec egress-proxy cat /var/log/squid/access.log`.
access_log stdio:/var/log/squid/access.log egress
cache_log /var/log/squid/cache.log
logfile_rotate 0
pid_filename none
