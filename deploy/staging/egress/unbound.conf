# The worker's resolver (SaaS-OS ADR-0059; decision D-STG): validating,
# answers only the worker's network, logs no queries.
server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 172.31.54.0/28 allow
    auto-trust-anchor-file: "/etc/unbound/root.key"
    val-permissive-mode: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    verbosity: 0
    log-queries: no
    log-replies: no
    use-syslog: no
    logfile: ""
    num-threads: 1
    cache-max-ttl: 3600
    local-zone: "resolver.check." static
    local-data: "health.resolver.check. A 127.0.0.1"
    chroot: ""
    username: "unbound"
    directory: "/etc/unbound"
    pidfile: ""

remote-control:
    control-enable: no
