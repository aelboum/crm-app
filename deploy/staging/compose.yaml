# LeadStack's production-shaped stack (decision brief H, section 7.1; decision
# D-STG). Locally it is the staging rehearsal; on a host it is the stack the
# brief describes, without the `stateful-local` profile (the host uses the
# managed PostgreSQL and Redis instead).
#
# Local run (no account, nothing leaves the machine except the worker's
# proxied HTTPS):
#   uv run python deploy/staging/prepare_local.py
#   docker compose --env-file deploy/staging/.local/compose.env \
#     -f deploy/staging/compose.yaml --profile stateful-local up -d --build
# Then https://leadstack.localhost:8443 (Caddy's local CA).
#
# Shape (SaaS-OS ADR-0010, ADR-0024, ADR-0028, ADR-0059):
# - `edge` is the only published service; it reaches only `app`.
# - `app`, `worker` and `migrate` run the one product image with
#   ENVIRONMENT=production and reach PostgreSQL with verify-full and Redis
#   over TLS.
# - The worker has no route to the Internet: it sits on internal networks
#   only and leaves through `egress-proxy` (CONNECT to port 443, public IPv4
#   literals only) with its own resolver.
# - `postgres` and `redis` (profile `stateful-local`) stand in for the
#   managed services, with TLS from the local CA, a non-superuser migration
#   role, `noeviction` and AOF.
# - `zitadel` and `zitadel-login` (Login V2) are served by the edge on the
#   app's own origin (SaaS-OS ADR-0025, as in deploy/local), self-hosted
#   with their own database on the same PostgreSQL over verify-full. They
#   sit on the internal `identity` network: no route out, nothing published.
#   The app reaches the issuer through the edge (alias `leadstack.localhost`)
#   and trusts only the local CA for it (`OIDC_CA_BUNDLE`).
# No secret is written here: values come from `.local/` (prepare_local.py).
# The app and worker get `app.env` only; `migrate` also gets `migrate.env`.

name: crm-app-staging

# Container logs rotate (Docker's json-file default never does): 5 files of
# 10 MB per container (decision D-STG.5).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  image: crm-app:staging
  build:
    context: ../..
    dockerfile: Dockerfile
  env_file:
    - .local/app.env
  volumes:
    - ./.local/ca.crt:/certs/ca.crt:ro
    # What the app and worker trust (prepare_local.py): the local CA only on
    # a laptop; the local CA plus the public CAs on a host (D-STG.5).
    - ./.local/trust.crt:/certs/trust.crt:ro
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    logging: *logging
    profiles: ["stateful-local"]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run prepare_local.py first}
      POSTGRES_DB: postgres
      CRM_APP_OWNER_PASSWORD: ${CRM_APP_OWNER_PASSWORD:?}
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      ZITADEL_DB_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
    # The server key must be owned by postgres with mode 0600, which a
    # bind mount from Windows cannot give: copy it in first.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        install -m 600 -o postgres -g postgres /certs/postgres.key /var/lib/postgresql/server.key &&
        install -m 644 -o postgres -g postgres /certs/postgres.crt /var/lib/postgresql/server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_min_protocol_version=TLSv1.2
    volumes:
      - ./.local/postgres.crt:/certs/postgres.crt:ro
      - ./.local/postgres.key:/certs/postgres.key:ro
      - ./init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - postgres-data:/var/lib/postgresql/data
    # On a single host (D-STG.5) they are the databases: back after a reboot.
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_app"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    logging: *logging
    profiles: ["stateful-local"]
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run prepare_local.py first}
    command:
      - sh
      - -c
      - >-
        exec redis-server --port 0 --tls-port 6380
        --tls-cert-file /certs/redis.crt --tls-key-file /certs/redis.key
        --tls-ca-cert-file /certs/ca.crt --tls-auth-clients no
        --requirepass "$$REDIS_PASSWORD"
        --appendonly yes --maxmemory-policy noeviction
    volumes:
      - ./.local/redis.crt:/certs/redis.crt:ro
      - ./.local/redis.key:/certs/redis.key:ro
      - ./.local/ca.crt:/certs/ca.crt:ro
      - redis-data:/data
    # On a single host (D-STG.5) they are the databases: back after a reboot.
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --tls --cacert /certs/ca.crt -h redis -p 6380 --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    command: ["crm-app-migrate"]
    env_file:
      - .local/app.env
      - .local/migrate.env
    restart: "no"
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  app:
    <<: *app
    networks: [internal, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false

  worker:
    <<: *app
    command: ["crm-app-worker"]
    environment:
      EGRESS_PROXY_URL: http://egress-proxy:3128
    dns:
      - 172.31.54.2
    networks: [internal, worker-dns]
    healthcheck:
      test: ["CMD", "crm-app-worker", "--check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        required: false
      egress-proxy:
        condition: service_healthy
      dns-resolver:
        condition: service_healthy

  edge:
    logging: *logging
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The site's TLS and the extra sites: local (the local CA's
      # certificate) by default, `host` on a real host (D-STG.5).
      - ./edge/site-${EDGE_MODE:-local}.caddy:/etc/caddy/site.caddy:ro
      - ./edge/extra-${EDGE_MODE:-local}.caddy:/etc/caddy/extra.caddy:ro
      - ./.local/edge.crt:/certs/edge.crt:ro
      - ./.local/edge.key:/certs/edge.key:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      STAGING_SITE: ${STAGING_SITE:-leadstack.localhost:8443}
      STAGING_HOST: ${STAGING_HOST:-leadstack.localhost}
    networks:
      edge:
        # The app reaches its issuer (the public origin) here, not through
        # the host: the same name and certificate the browser sees.
        aliases:
          - "${STAGING_HOST:-leadstack.localhost}"
      identity: {}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy

  # ZITADEL's image has no shell and runs as a non-root user, so it cannot
  # prepare the directory it writes its bootstrap tokens to (as deploy/local).
  zitadel-bootstrap-dir:
    logging: *logging
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ["sh", "-c", "mkdir -p /bootstrap && chmod 0777 /bootstrap"]
    volumes:
      - ./.local/bootstrap:/bootstrap
    network_mode: none

  zitadel:
    logging: *logging
    # The release deploy/local pins (v4.20.1, decision ZIT-1; past the
    # advisories in GHSA-x4c7-fpcx-w9q6 and its siblings).
    image: ghcr.io/zitadel/zitadel:v4.20.1@sha256:4817dbd8896306867f28bba63e7dc3526b2d2646ac7111db9524eb3ab6e82301
    # TLS ends at the edge; ZITADEL is told its public URL is https.
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "external"]
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?run prepare_local.py first}
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: verify-full
      ZITADEL_DATABASE_POSTGRES_USER_SSL_ROOTCERT: /certs/ca.crt
      # No database administrator: the role and database exist already
      # (init/01-roles.sh, as an operator would prepare a managed service),
      # so ZITADEL connects as its own non-superuser owner for init too.
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_DB_PASSWORD:?}
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: verify-full
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_ROOTCERT: /certs/ca.crt
      # What browsers see and what appears as the token `iss`: the app's own
      # origin. Changing it needs a fresh ZITADEL database.
      ZITADEL_PORT: "8080"
      ZITADEL_EXTERNALDOMAIN: ${STAGING_HOST:-leadstack.localhost}
      ZITADEL_EXTERNALPORT: "${STAGING_PORT:-8443}"
      ZITADEL_EXTERNALSECURE: "true"
      # Also read by `zitadel ready` (the healthcheck), which gets no flags.
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: crm-app-staging
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: admin@${STAGING_HOST:-leadstack.localhost}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false" # pragma: allowlist secret
      # Local rehearsal only: personal access tokens in .local/bootstrap for
      # identity_local.py and Login V2. A host uses a system-user key
      # instead (SaaS-OS ADR-0025 section 7).
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/bootstrap.pat
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2100-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: ${STAGING_ORIGIN:-https://leadstack.localhost:8443}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: ${STAGING_ORIGIN:-https://leadstack.localhost:8443}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: ${STAGING_ORIGIN:-https://leadstack.localhost:8443}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: ${STAGING_ORIGIN:-https://leadstack.localhost:8443}/ui/v2/login/login?samlRequest=
    volumes:
      - ./.local/ca.crt:/certs/ca.crt:ro
      - ./.local/bootstrap:/bootstrap
    networks: [internal, identity]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      zitadel-bootstrap-dir:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 30

  zitadel-login:
    logging: *logging
    # ZITADEL's published Login V2 by default; ZITADEL_LOGIN_IMAGE selects
    # crm-app's LeadStack build of the same release (decisions S-2, P2-G.1;
    # the crm-app-login repository), which staging runs (decision ZIT-1).
    image: ${ZITADEL_LOGIN_IMAGE:-ghcr.io/zitadel/zitadel-login:v4.20.1@sha256:1508e83275f1471b20ed42b159174e6b3e10e6c2481e64c0aee7ed5bfeeec18b}
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_LOGIN_SESSION_COOKIE_SECRET:?}
      # ZITADEL picks its instance from Host: the public host.
      CUSTOM_REQUEST_HEADERS: Host:${STAGING_HOST:-leadstack.localhost},X-Forwarded-Proto:https
    volumes:
      - ./.local/bootstrap:/bootstrap:ro
    networks: [identity]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      zitadel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 20

  egress-proxy:
    logging: *logging
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
    # Squid sizes a table from the open-file limit; where Docker leaves it
    # unlimited (Debian 13's containerd: ~1 billion) it cannot start.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    tmpfs:
      - /var/log/squid:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
    networks: [internal, egress]
    restart: unless-stopped
    healthcheck:
      # bash, not sh: the image's /bin/sh (dash) has no /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 10s
      timeout: 5s
      retries: 5

  dns-resolver:
    logging: *logging
    image: alpinelinux/unbound:latest@sha256:cd8dcbcaa7b6f223fe154be07f17c13006149be7f56d50c5664f46181e8d5e1b
    volumes:
      - ./egress/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      worker-dns:
        ipv4_address: 172.31.54.2
      egress: {}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nslookup", "health.resolver.check", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  # Reaches the Internet: the edge's clients, and the proxy's and
  # resolver's upstreams. The app needs it later for ZITADEL and providers.
  edge:
  egress:
  # No route out.
  internal:
    internal: true
  # The edge, ZITADEL and Login V2 only; no route out.
  identity:
    internal: true
  worker-dns:
    internal: true
    ipam:
      config:
        - subnet: 172.31.54.0/28
          # Dynamic addresses (the worker's) come from .8 to .15 only, so
          # the resolver's fixed .2 is free when Docker starts both at once
          # after a reboot (D-STG.5: it was taken, the resolver failed).
          ip_range: 172.31.54.8/29

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
