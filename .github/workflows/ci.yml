# Quality gates for every push and pull request. Inactive until the
# repository is pushed (not yet approved). No deploy, publish or release
# step. The only credentials are disposable passwords for the per-run
# PostgreSQL service container, which exists only on the CI runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every commit on main gets its own group, so no main run is cancelled or
# replaced by a later one and each pushed commit gets a result. Other refs
# (pull requests) keep one group per ref and cancel superseded runs.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_PYTHON: "3.13"

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Lockfile is current
        run: uv lock --check
      - name: Install (locked)
        run: uv sync --locked
      - name: Format
        run: uv run --no-sync ruff format --check .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Types
        run: uv run --no-sync pyright
      - name: Import boundaries
        run: uv run --no-sync lint-imports
      - name: Unit tests
        run: uv run --no-sync pytest tests/unit

  frontend:
    # The single-page app (decision P-6.1). Node is a build tool only.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install (locked)
        run: npm ci --ignore-scripts
      - name: Generated API types are current
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Types
        run: npm run typecheck
      - name: Lint (including accessibility rules)
        run: npm run lint
      - name: Tests (including axe accessibility scans)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=low

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: crm_app_owner
          POSTGRES_PASSWORD: ci-owner-password # pragma: allowlist secret
          POSTGRES_DB: crm_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crm_app_owner -d crm_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      CRM_APP_REQUIRE_INTEGRATION: "1"
      APP_DB_USER: crm_app_runtime
      DATABASE_URL: postgresql+psycopg://crm_app_runtime:ci-runtime-password@127.0.0.1:5432/crm_app_test # pragma: allowlist secret
      MIGRATIONS_DATABASE_URL: postgresql+psycopg://crm_app_owner:ci-owner-password@127.0.0.1:5432/crm_app_test # pragma: allowlist secret
      REDIS_URL: redis://127.0.0.1:6379/1
      OIDC_ISSUER_URL: http://identity.invalid
      OIDC_CLIENT_ID: integration-placeholder
      PUBLIC_APP_ORIGIN: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Create the runtime role and the test database
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci-owner-password # pragma: allowlist secret
          POSTGRES_USER: crm_app_owner
          POSTGRES_DB: crm_app
          APP_DB_PASSWORD: ci-runtime-password # pragma: allowlist secret
        run: sh deploy/local/init/01-roles.sh
      - name: Install (locked)
        run: uv sync --locked
      - name: Integration tests
        run: uv run --no-sync pytest tests/integration

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install (locked)
        run: uv sync --locked
      - name: Dependency audit
        # SaaS-OS is a Git dependency with no index entry; its pin is reviewed
        # by decision (docs/project/DECISIONS.md, K3), not by pip-audit.
        run: |
          uv export --frozen --all-groups --no-emit-project --no-emit-package saas-os \
            --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
          uv run --no-sync pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Secret scan
        run: |
          git ls-files -z | xargs -0 uv run --no-sync detect-secrets-hook --baseline .secrets.baseline
